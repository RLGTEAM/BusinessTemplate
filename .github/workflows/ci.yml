name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    name: Validate, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run test:ltr-build

  e2e:
    name: Playwright + axe smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # @visual snapshots are gitignored, per-machine baselines — CI has none,
      # so test:e2e itself excludes the visual suite (--grep-invert @visual);
      # it's local-only, not a CI-specific exclusion.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets (LCP/INP/CLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lhci
